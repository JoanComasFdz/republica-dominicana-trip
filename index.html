<style>
  :root{--bg:#0f2a3f;--card:#13344d;--ink:#eef4f8;--muted:#9fb8c9;--accent:#38a1db;--bad:#e07a76}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .box{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px 26px;width:100%;max-width:340px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .ico{font-size:40px}
  h1{font-size:18px;margin:10px 0 4px}
  p{font-size:13px;color:var(--muted)}
  input[type=password]{width:100%;margin-top:18px;padding:12px 14px;font-size:20px;letter-spacing:.3em;text-align:center;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#0b2234;color:#fff;outline:none}
  input[type=password]:focus{border-color:var(--accent)}
  label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);margin-top:12px;cursor:pointer}
  button{width:100%;margin-top:14px;padding:12px;font-size:15px;font-weight:600;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .msg{min-height:18px;margin-top:10px;font-size:13px;color:var(--bad)}
</style>

  <button id="go">Open</button>
  <div class="msg" id="msg"></div>
</form>

const KEY = 'tripplanner.pin';
const u8 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function unlock(pin){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(DATA.s), iterations:DATA.it, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(DATA.iv)}, key, u8(DATA.c));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }

const f = document.getElementById('f'), go = document.getElementById('go'), msg = document.getElementById('msg');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const pin = document.getElementById('pin').value.trim(); if(!pin) return;
  go.disabled = true; go.textContent = 'Unlocking…'; msg.textContent = '';
  try {
    const html = await unlock(pin);
    try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, pin); } catch(_) {}
    show(html);
  } catch(_) {
    go.disabled = false; go.textContent = 'Open'; msg.textContent = 'Wrong PIN, try again.';
  }
});

// Auto-unlock when the PIN was remembered on this device
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(_) {}
  if (!saved) return;
  go.disabled = true; go.textContent = 'Unlocking…';
  try { show(await unlock(saved)); }
  catch(_) { try { localStorage.removeItem(KEY); } catch(__) {} go.disabled = false; go.textContent = 'Open'; }
})();
</script>
